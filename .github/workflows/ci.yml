name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  static:
    # Syntax (Microsoft powerquery-parser) + static checks + .mez packaging.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run ci
      - uses: actions/upload-artifact@v4
        with:
          name: EulerianMarketingPlatform.mez
          path: dist/EulerianMarketingPlatform.mez

  pqtest:
    # Evaluates the connector with the Power Query SDK test runner against the mock API.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: Install Power Query SDK tools (PQTest)
        shell: pwsh
        run: |
          nuget install Microsoft.PowerQuery.SdkTools -OutputDirectory .tools -ExcludeVersion -NonInteractive
          $pqtest = Get-ChildItem -Recurse .tools -Filter PQTest.exe | Select-Object -First 1
          if (-not $pqtest) { throw "PQTest.exe not found in Microsoft.PowerQuery.SdkTools" }
          "PQTEST=$($pqtest.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Run PQTest facts against the mock API
        shell: pwsh
        run: |
          # The mock runs in this same step so that it is still alive while PQTest evaluates the query.
          $mock = Start-Process -FilePath node -ArgumentList "mock-server/server.mjs" -NoNewWindow -PassThru
          $up = $false
          for ($i = 0; $i -lt 30 -and -not $up; $i++) {
            try { Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8787/__mock/requests | Out-Null; $up = $true } catch { Start-Sleep -Seconds 1 }
          }
          if (-not $up) { throw "mock API did not start on http://127.0.0.1:8787" }

          $ext = "dist\EulerianMarketingPlatform.mez"
          $query = "test\pqtest\EulerianMarketingPlatform.query.pq"
          $template = & $env:PQTEST credential-template -e $ext -q $query -p -ak Key | Out-String | ConvertFrom-Json
          $template.AuthenticationProperties.Key = "mock-token"
          $template | ConvertTo-Json -Depth 10 | & $env:PQTEST set-credential -e $ext -q $query -p

          $out = & $env:PQTEST run-test -e $ext -q $query -p | Out-String
          Write-Host $out
          Stop-Process -Id $mock.Id -ErrorAction SilentlyContinue
          # The output echoes the query source, so check the result fields rather than searching for error names.
          if ($LASTEXITCODE -ne 0 -or $out -match '"Status":\s*"(Failed|Failure|Error)"' -or $out -match '"Passed":\s*false') { exit 1 }
          if ($out -notmatch '"Status":\s*"Passed"') { throw "PQTest did not report a passed run" }
